name: Deploy backend

# Deploys the affiliate-hub-api worker on push to main (Cyber account,
# cyber-e54). Applies outstanding D1 migrations (api/migrations/*.sql) before
# every deploy, so new migration files ship automatically with the code that
# needs them. Worker secrets (ACCESS_TOKEN_SECRET, REFRESH_TOKEN_SECRET,
# VISITOR_HASH_SALT, FIELD_ENCRYPTION_KEY) must exist (set once via
# `wrangler secret put`); this workflow never touches them.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply affiliate-hub-db-v2 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://affiliate-hub.cyber-e54.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::affiliate-hub-api health check failed"; exit 1; }
